name: "Mono-Repo CI/CD Pipeline"

on:
  push:
    branches:
      - dev
      - staging
      - main
  pull_request:
    branches:
      - dev
      - staging
      - main

env:
  TOFU_VERSION: "1.8.8"
  TG_VERSION: "0.77.22"

jobs:
  # Step 1: Detect Target Environment based on Git Branch
  set-env:
    runs-on: ubuntu-latest
    outputs:
      target_env: ${{ steps.select_env.outputs.target_env }}
    steps:
      - id: select_env
        run: |
          if [ "${{ github.ref_name }}" == "main" ]; then
            echo "target_env=prod" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" == "staging" ]; then
            echo "target_env=staging" >> $GITHUB_OUTPUT
          else
            echo "target_env=dev" >> $GITHUB_OUTPUT
          fi

  # Step 2: Infrastructure Provisioning (OpenTofu + Terragrunt)
  infrastructure:
    needs: set-env
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Terragrunt Plan
        uses: gruntwork-io/terragrunt-action@v3
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tg_version: ${{ env.TG_VERSION }}
          tg_dir: "infra/live/${{ needs.set-env.outputs.target_env }}/frontend"
          tg_command: "plan"

      - name: Terragrunt Apply
        if: github.event_name == 'push'
        uses: gruntwork-io/terragrunt-action@v3
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tg_version: ${{ env.TG_VERSION }}
          tg_dir: "infra/live/${{ needs.set-env.outputs.target_env }}/frontend"
          tg_command: "apply"
          tg_add_approve: true

  # Step 3: React App Build & S3/CloudFront Deployment
  deploy-app:
    needs: [set-env, infrastructure]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install & Build React App
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sync Build to S3 & Invalidate CloudFront Cache
        run: |
          ENV="${{ needs.set-env.outputs.target_env }}"
          BUCKET_NAME="my-react-app-$ENV-site-unique123"
          
          # Sync static production assets
          aws s3 sync ./frontend/build s3://$BUCKET_NAME --delete

          # Find associated CloudFront Distribution ID and clear cache
          DIST_ID=$(aws cloudfront list-distributions --output json | jq -r --arg bucket "$BUCKET_NAME" '.DistributionList.Items[] | select(.Origins.Items[0].DomainName | contains($bucket)) | .Id')
          
          if [ -n "$DIST_ID" ] && [ "$DIST_ID" != "null" ]; then
            echo "Invalidating CloudFront cache for Distribution ID: $DIST_ID"
            aws cloudfront create-invalidation --distribution-id $DIST_ID --paths "/*"
          else
            echo "CloudFront Distribution ID not found for invalidation."
          fi
